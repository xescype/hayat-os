<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="hayat-os: bir pencerenin önünden geçen güneş ve her gün kendini çizen bir çizgi; Latince söz Nulla dies sine linea, Çizgisiz gün olmasın">
