# 1A Task 14: birim + entegrasyon test job (Postgres service).
name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: hayatos
          POSTGRES_PASSWORD: hayatos
          POSTGRES_DB: hayatos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hayatos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://hayatos:hayatos@localhost:5432/hayatos_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -r test
      - run: pnpm --filter @hayatos/api test:integration
